# PostgreSQL para desarrollo. Una sola instancia con dos bases (identidad y negocio) que crea `npm run db:setup`.
services:
  postgres:
    image: postgres:16
    container_name: srm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${PG_ADMIN_USER:-postgres}"
      POSTGRES_PASSWORD: "${PG_ADMIN_PASSWORD:?Falta PG_ADMIN_PASSWORD en .env - corre npm run setup:env}"
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"   # solo accesible desde este equipo, no desde la red
    volumes:
      - srm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_ADMIN_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  srm_pgdata:
